name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Publish (self-contained single file)
        run: dotnet publish MonitorSwitch.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish

      - name: Compile installer
        run: iscc MonitorSwitch.iss

      - name: Upload exe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: MonitorSwitch
          path: publish/MonitorSwitch.exe

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: MonitorSwitch-Setup
          path: Output/MonitorSwitch-Setup-*.exe

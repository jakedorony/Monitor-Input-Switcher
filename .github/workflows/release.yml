name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish (self-contained single file)
        run: dotnet publish MonitorSwitch.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish

      - name: Compile installer
        run: iscc MonitorSwitch.iss

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          publish/MonitorSwitch.exe
          Output/MonitorSwitch-Setup-*.exe
          --title "Monitor Input Switcher ${{ github.ref_name }}"
          --generate-notes

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Publish (self-contained single file)
        run: dotnet publish MonitorSwitch.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish

      - name: Compile installer
        run: iscc MonitorSwitch.iss

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          publish/MonitorSwitch.exe
          Output/MonitorSwitch-Setup-*.exe
          --title "Monitor Input Switcher ${{ github.ref_name }}"
          --generate-notes
